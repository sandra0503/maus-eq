<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maus EQ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="unit">
      <header class="unit-top">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-name">MAUS<span>·EQ</span></span>
        </div>
        <div class="unit-meta">BLEND ON THE FLY · MIDI PORT “Maus EQ”</div>
        <div class="power"><span class="led"></span>ON</div>
      </header>

      <main id="channels" class="channels"></main>

      <section class="settings">
        <div class="set-group">
          <span class="set-label">STEP</span>
          <input type="range" min="1" max="12" value="2" id="stepRange" />
          <span class="set-val" id="stepVal">2</span>
        </div>
      </section>

      <footer class="unit-bottom">
        <span>Hover a knob to turn it · RESET / MIN jump instantly · or use the keyboard</span>
        <span class="screws"><i></i><i></i><i></i><i></i></span>
      </footer>
    </div>
    <script src="app.js"></script>
  </body>
</html>
