<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EQ Controller</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="unit">
      <header class="unit-top">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-name">PHASE<span>·EQ</span></span>
        </div>
        <div class="unit-meta">DUAL CHANNEL EQ · PORT “PHASE-EQ”</div>
        <div class="power"><span class="led"></span>ON</div>
      </header>

      <main id="channels" class="channels"></main>

      <footer class="unit-bottom">
        <span>Hover a knob to turn it (faster mouse = bigger steps) · double-click resets · or use the keyboard</span>
        <span class="screws"><i></i><i></i><i></i><i></i></span>
      </footer>
    </div>
    <script src="app.js"></script>
  </body>
</html>
